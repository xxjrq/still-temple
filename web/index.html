body:has(.shop-page){overflow:auto;background:#eeece3}
.shop-page{max-width:820px;margin:0 auto;padding:52px 24px 96px;color:#4d5144;font:16px/1.85 system-ui,-apple-system,sans-serif}
.shop-page .shop-back{display:inline-block;margin-bottom:22px;color:#6a6045;text-decoration:none;font-size:13px;letter-spacing:.04em}
.shop-page h1{font-size:30px;font-weight:500;letter-spacing:.08em;margin:0 0 10px}
.shop-page h2{font-size:17px;font-weight:600;letter-spacing:.06em;margin:44px 0 14px;padding-bottom:8px;border-bottom:1px solid #d7d0bd}
.shop-page header p{margin:0;color:#737565;max-width:44em}
.shop-balance{display:flex;align-items:baseline;gap:10px;margin-top:26px;color:#737565;font-size:13px;letter-spacing:.05em}
.shop-incense{font-size:30px;color:#4d5144;font-weight:500;font-variant-numeric:tabular-nums}
.shop-notice{margin:18px 0 0;padding:11px 16px;border:1px solid #d7d0bd;border-radius:14px;background:#f6f3ea;font-size:14px;color:#6a6045}
.shop-packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:12px}
.shop-pack{display:grid;gap:2px;padding:16px 14px;border:1px solid #cfc7b4;border-radius:18px;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;transition:background .18s ease,border-color .18s ease}
.shop-pack:hover:not(:disabled){background:#f4f0e5;border-color:#a99a7b}
.shop-pack:disabled{opacity:.45;cursor:default}
.shop-pack strong{font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.shop-pack span{font-size:12px;color:#737565;letter-spacing:.06em}
.shop-pack em{font-style:normal;margin-top:8px;font-size:14px;color:#6a6045}
.shop-fine{font-size:12.5px;line-height:1.75;color:#868873;margin:12px 0 0}
.shop-item{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:flex-end;padding:18px;border:1px solid #d7d0bd;border-radius:18px;background:#f6f3ea}
.shop-item>div:first-child{display:grid;gap:2px}
.shop-item>div:first-child strong{font-weight:600;letter-spacing:.04em}
.shop-item>div:first-child span{font-size:12px;color:#868873}
.shop-owned{font-size:13px;color:#6a6045;letter-spacing:.05em}
.shop-claim{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.shop-claim label{display:grid;gap:4px;font-size:11.5px;letter-spacing:.05em;color:#868873}
.shop-claim input{min-width:190px;padding:7px 2px;border:0;border-bottom:1px solid #b9b09a;background:transparent;color:inherit;font:15px system-ui,sans-serif;outline:none}
.shop-claim input:focus{border-bottom-color:#6a6045}
.shop-claim button{padding:9px 18px;border:1px solid #a99a7b;border-radius:22px;background:transparent;color:#4d5144;font:14px system-ui,sans-serif;cursor:pointer}
.shop-claim button:hover:not(:disabled){background:#6a6045;border-color:#6a6045;color:#f6f3ea}
.shop-claim button:disabled{opacity:.5;cursor:default}
.shop-patrons{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0;padding:0;list-style:none}
.shop-patrons li{font-size:15px;color:#5b5a4a}
.shop-patrons li::before{content:"·";margin-right:9px;color:#b9b09a}
.shop-note{margin-top:52px;font-size:12px;line-height:1.8;color:#8a8c78;max-width:52em}
.shop-languages{display:flex;flex-wrap:wrap;gap:16px;margin-top:26px;font-size:12px}
.shop-languages a{color:#6a6045;text-decoration:none;opacity:.7}
.shop-languages a[aria-current=page]{opacity:1;text-decoration:underline;text-underline-offset:4px}
@media(max-width:600px){.shop-page{padding:36px 18px 76px}.shop-page h1{font-size:25px}.shop-item{padding:16px}.shop-claim input{min-width:150px}}
.shop-signin{margin-top:26px;padding:18px 20px;border:1px solid #d7d0bd;border-radius:18px;background:#f6f3ea;display:grid;gap:10px;justify-items:start}
.shop-signin strong{font-weight:600;letter-spacing:.04em}
.shop-signin p{margin:0;font-size:13.5px;line-height:1.7;color:#737565;max-width:44em}
.shop-signin button{padding:10px 20px;border:1px solid #6a6045;border-radius:22px;background:#6a6045;color:#f6f3ea;font:14px system-ui,sans-serif;cursor:pointer}
.shop-signin button:hover:not(:disabled){background:#574f39}
.shop-signin button:disabled{background:transparent;color:#8a8c78;border-color:#cfc7b4;cursor:default}
.shop-signin small{font-size:12px;color:#8a8c78}
.shop-account{display:flex;align-items:center;gap:10px;margin-top:22px;font-size:12.5px;color:#737565}
.shop-account img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.shop-account button{margin-left:auto;background:none;border:0;color:#6a6045;font:12px system-ui,sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
/* Make the shop entry a real button instead of another faint language link. */
.temple-language{flex-wrap:wrap;row-gap:10px}
.temple-language a[href$="/shop"]{order:-1;padding:9px 16px;border:1px solid #e0c49c;border-radius:22px;background:#2b2620e6;color:#ffe4bd;opacity:1;font-weight:600;letter-spacing:.06em;font-size:12px;text-decoration:none;box-shadow:0 4px 16px #00000059}
.temple-language a[href$="/shop"]:hover{background:#3a322a}
.temple-language a[href$="/shop"]::before{content:"🪷";margin-inline-end:6px}
@media(max-width:600px){.temple-language{bottom:88px;gap:12px}.temple-language a[href$="/shop"]{padding:8px 14px}}

/* 本地镜像补丁：隐藏连接条、按真实房间算人数、解开房间列表接管换房、切语言保留当前房间 */
(function () {
  var tries = 0;

  function roomNumber() {
    var m = location.search.match(/room=maru(?:-(\d+))?/);
    return m ? (m[1] ? parseInt(m[1], 10) : 1) : 1;
  }

  function roomId(n) {
    return n === 1 ? 'maru' : 'maru-' + String(n).padStart(2, '0');
  }

  function goRoom(n) {
    var u = new URL(location.href);
    u.searchParams.set('room', roomId(n));
    u.searchParams.set('instance', '0');
    u.searchParams.set('region', 'apac');
    location.href = u.toString();
  }

  /* 客户端没有 WebSocket，房间按钮会一直禁用；这里解开并接管点击 */
  function bindRooms() {
    var cur = roomNumber();
    var list = document.querySelectorAll('.room-choice');
    for (var i = 0; i < list.length; i++) {
      var b = list[i];
      var strong = b.querySelector('strong');
      var m = strong ? (strong.textContent || '').match(/(\d+)/) : null;
      if (!m) continue;
      var n = parseInt(m[1], 10);
      if (n === cur) { b.disabled = true; continue; }
      if (b.disabled) b.disabled = false;
      if (b.dataset.mirrorBound) continue;
      b.dataset.mirrorBound = '1';
      b.addEventListener('click', function (e) {
        var s = this.querySelector('strong');
        var mm = s ? (s.textContent || '').match(/(\d+)/) : null;
        if (!mm) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        goRoom(parseInt(mm[1], 10));
      }, true);
    }
  }

  /* 语言切换是整页跳转，把当前房间带上，不然会回到第 1 间 */
  function fixLangLinks() {
    var links = document.querySelectorAll('a[hreflang]');
    for (var i = 0; i < links.length; i++) {
      var a = links[i];
      var href = a.getAttribute('href');
      if (!href) continue;
      var u = new URL(href, location.origin);
      u.searchParams.set('room', roomId(roomNumber()));
      u.searchParams.set('instance', '0');
      u.searchParams.set('region', 'apac');
      var want = u.pathname + u.search;
      if (a.getAttribute('href') !== want) a.setAttribute('href', want);
    }
  }

  /* 本地没有 socket 后端，用同风格几何体拼几个香客，让场景有人气 */
  var DOLL_COUNT = 5;

  function spawnDolls(game) {
    var Sph = null, Cyl = null, MeshC = null, MatC = null;
    game.scene.traverse(function (o) {
      if (o.isSkinnedMesh || !o.isMesh) return;
      if (!MeshC) MeshC = o.constructor;
      if (!Sph && o.geometry && o.geometry.type === 'SphereGeometry') Sph = o.geometry.constructor;
      if (!Cyl && o.geometry && o.geometry.type === 'CylinderGeometry') Cyl = o.geometry.constructor;
      if (!MatC && o.material && o.material.type === 'MeshStandardMaterial') MatC = o.material.constructor;
    });
    if (!Sph || !Cyl || !MeshC || !MatC) return false;

    var GroupC = game.self.group.constructor;
    var mSkin = new MatC({ color: 0xd2a173, roughness: 0.88, metalness: 0 });
    var mRobe = new MatC({ color: 0xdfe4e2, roughness: 0.92, metalness: 0 });
    var mApron = new MatC({ color: 0xecdb9b, roughness: 0.9, metalness: 0 });
    var mFoot = new MatC({ color: 0xe9ece9, roughness: 0.92, metalness: 0 });

    var p0 = game.self.group.position;
    var spots = [
      [4.7, -9.6, 3.0],
      [-1.5, -12.6, 2.9],
      [3.1, -16.6, 3.2],
      [-0.1, -5.6, 2.6],
      [6.4, -3.6, 2.5]
    ];

    var dolls = [];
    for (var i = 0; i < spots.length; i++) {
      var s = spots[i];
      var g = new GroupC();
      var head = new MeshC(new Sph(0.185, 20, 16), mSkin);
      head.position.y = 0.83;
      var body = new MeshC(new Cyl(0.16, 0.245, 0.4, 16), mRobe);
      body.position.y = 0.5;
      var apron = new MeshC(new Cyl(0.165, 0.255, 0.34, 16), mApron);
      apron.position.set(0, 0.44, 0.05);
      apron.scale.set(1, 0.9, 0.42);
      var f1 = new MeshC(new Sph(0.075, 12, 10), mFoot);
      f1.position.set(-0.09, 0.055, 0.01);
      var f2 = f1.clone();
      f2.position.x = 0.09;
      g.add(head, body, apron, f1, f2);
      g.traverse(function (o) {
        o.castShadow = false;
        o.receiveShadow = false;
        o.frustumCulled = false;
      });
      g.position.set(p0.x + s[0], p0.y, p0.z + s[1]);
      g.rotation.y = s[2];
      game.scene.add(g);
      dolls.push({ group: g, baseY: p0.y, phase: i * 1.3 });
    }
    window.__sansaDolls = dolls;

    var t0 = performance.now();
    setInterval(function () {
      if (document.hidden) return;
      var t = (performance.now() - t0) / 1000;
      for (var k = 0; k < dolls.length; k++) {
        dolls[k].group.position.y = dolls[k].baseY + Math.sin(t * 1.1 + dolls[k].phase) * 0.015;
      }
    }, 100);
    return true;
  }

  /* 每帧渲染都会把这个实例传进来，借它拿到 game，等场景就绪再放人 */
  function hookRuntime() {
    var rt = window.sansaAppearanceRuntime;
    if (!rt || rt.__mirrorHooked) return;
    rt.__mirrorHooked = true;
    var orig = rt.update;
    rt.update = function (game) {
      if (game && game.isReady && !window.__sansaDolls) spawnDolls(game);
      return orig.call(this, game);
    };
  }

  function paint() {
    var el = document.getElementById('game-presence-count');
    if (el) {
      var want = String(1 + DOLL_COUNT).padStart(2, '0') + '/100';
      if (el.textContent !== want) el.textContent = want;
    }
    /* 人数语义占掉了 NN/100，房间号补回标题后面 */
    var roomEl = document.getElementById('game-room');
    if (roomEl) {
      if (!roomEl.dataset.mirrorBase) roomEl.dataset.mirrorBase = (roomEl.textContent || '').trim();
      var wantRoom = roomEl.dataset.mirrorBase + ' #' + roomNumber();
      if (roomEl.textContent !== wantRoom) roomEl.textContent = wantRoom;
    }
    var conn = document.getElementById('game-connection');
    if (conn) conn.style.display = 'none';
    bindRooms();
    fixLangLinks();
    hookRuntime();
  }

  function boot() {
    if (!document.querySelector('canvas') || document.body.innerText.indexOf('Could not load') >= 0) {
      if (tries++ < 120) return setTimeout(boot, 500);
      return;
    }
    var st = document.createElement('style');
    st.textContent = '#game-connection{display:none!important}';
    document.head.appendChild(st);
    paint();
    setInterval(paint, 600);
  }
  boot();
})();
</script>
